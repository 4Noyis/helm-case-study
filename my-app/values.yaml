replicaCount: 2

image:
  repository: registry.registry.svc.cluster.local:5000/hello-app
  tag: "latest"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 3000
  nodePort: 30090

app:
  message: "Hello from GitOps!"

resources:
  limits:
    cpu: "200m"
    memory: "128Mi"
  requests:
    cpu: "100m"
    memory: "64Mi"
