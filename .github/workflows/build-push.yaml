name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/arm64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Build and Push with Kaniko
        run: |
          cat <<KANIKO_EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: kaniko-${{ github.sha }}
            namespace: default
          spec:
            initContainers:
            - name: git-clone
              image: alpine/git
              command: ['sh', '-c', 'git clone https://github.com/4Noyis/helm-case-study.git /workspace && cp -r /workspace/hello-app/* /context/']
              volumeMounts:
              - name: context
                mountPath: /context
            containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:latest
              args:
              - "--dockerfile=/context/Dockerfile"
              - "--context=dir:///context"
              - "--destination=registry.registry.svc.cluster.local:5000/hello-app:${{ github.sha }}"
              - "--insecure"
              volumeMounts:
              - name: context
                mountPath: /context
            restartPolicy: Never
            volumes:
            - name: context
              emptyDir: {}
          KANIKO_EOF
          
          echo "Waiting for Kaniko build to complete..."
          kubectl wait --for=condition=Ready pod/kaniko-${{ github.sha }} -n default --timeout=60s || true
          sleep 30
          kubectl logs kaniko-${{ github.sha }} -n default -c kaniko
          kubectl delete pod kaniko-${{ github.sha }} -n default

      - name: Verify image in registry
        run: |
          echo "Image pushed: registry.registry.svc.cluster.local:5000/hello-app:${{ github.sha }}"
